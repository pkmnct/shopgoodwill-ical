version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a few days before proposing a release, so a compromised or broken
    # version is usually pulled before it can be auto-merged here
    cooldown:
      default-days: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Tracks the Node major in the Dockerfile (26), not the newest release.
      # Move it by hand together with the two images there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # No docker ecosystem: the Dockerfile's images use floating tags
  # (node:26-trixie-slim, distroless nodejs26) with no version Dependabot could
  # bump below a major. Their patches arrive through the weekly rebuild in
  # publish.yml; a new Node major is moved by hand in both stages.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
