version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a few days before proposing a release, so a compromised or broken
    # version is usually pulled before it can be auto-merged here
    cooldown:
      default-days: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Tracks the Node major in the Dockerfile (26), not the newest release.
      # Move it by hand together with the two images there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # These updates can auto-merge too, so they get the same waiting period
    cooldown:
      default-days: 5
    ignore:
      # The build stage must stay on the same Node major as the distroless
      # runtime stage, whose version is part of the image name. Move both by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
